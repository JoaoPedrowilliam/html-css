<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com HTML5</title>
</head>
<body>
    <h1>Inserindo Vídeos hospedados localmente</h1>
    <p>Este vídeo está hospedado no meu próprio servidor.</p>

    <video  width="560" poster="imagens/limoes-capa.png" controls autoplay loop>
        <source src="mideia/meu-video.mp4" width type="video/mp4">
        <source src="mideia/meu-video.mv4" type="video/mv4">
        <source src="mideia/meu-video.webm" type="video/wrbm"> 
        <source src="mideia/meu-video.ogv" type="video/ogv"> 
        <p>Seu navegador não tem compatibilidade com a reprodução de vídeos.</p>
    </video>
   
    <h1>Inserindo videos do YouTube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/OzUnqQk4eOg?si=NnHbmQA9PbRc0QWB" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
