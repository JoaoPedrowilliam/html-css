<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>

        /* SELETORES PERSONALIZADOS 
            #  = ID
            .  = CLASS
            :  = PSEUDO CLASS
            :: = PESEUDO ELEMENT
            >  = CLILDREN       
        */

        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: black;
        }
        
        a{
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited{
            color: darkred;
        }

        a:hover {
            color: black;
            text-decoration: underline;

        }
        a:active{
            color: yellow;
        }
        a::after{
            content: '[Link]';
            text-decoration: none;
            font-weight: normal;
            color: darkgrey;
        }


    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://github.com/JoaoPedrowilliam" target="_blank">Respositorio do GitHub</a></li>
        <li><a href="https://www.youtube.com/@joaopedrowilliam9540" target="_blank">Canal do YouTube</a></li>
        <li><a href="https://joaopedrowilliam.github.io/bike-craft/" target="_blank">BikeCraft</a></li>
    </ul>

    
</body>
</html>
